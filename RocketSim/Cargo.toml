# RocketSim v3 (ZealanL/RocketSim branch v3-rust, commit 6cf55d3, version 0.2.11), workspace fields filled in
[package]
name = "rocketsim"
version = "0.2.11"
edition = "2024"
rust-version = "1.95"
description = "Simulate Rocket League games at maximum efficiency"
license = "MIT"
repository = "https://github.com/ZealanL/RocketSim"

[dependencies]
arrayvec = "0.7.6"
byteorder = "1.5.0"
fastrand = "2.3.0"
fern = "0.7.1"
glam = { version = "0.33.5", features = ["debug-glam-assert"] }
log = "0.4.29"
rustc-hash = "2.1.2"
serde = { version = "1", features = ["derive"], optional = true }

[features]
default = []
serde = ["dep:serde", "glam/serde"]
